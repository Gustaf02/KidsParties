    <div class="container mt-5">
        <h1 class="text-center">Administración de Salones</h1>
        <form id="salon-form">
            <input type="hidden" id="salon-id">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="mb-3">
                <label for="capacidad" class="form-label">Capacidad</label>
                <input type="number" class="form-control" id="capacidad" required>
            </div>
            <div class="mb-3">
                <label for="precio" class="form-label">Precio</label>
                <input type="number" class="form-control" id="precio" required>
            </div>
            <div class="mb-3">
                <label for="fecha" class="form-label">Fecha</label>
                <input type="date" class="form-control" id="fecha" required>
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
        <hr>
        <h2 class="text-center">Lista de Salones</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Capacidad</th>
                    <th>Precio</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="salones-list"></tbody>
        </table>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('salon-form');
    const salonList = document.getElementById('salones-list');

   function loadSalones() {
    salonList.innerHTML = ''; 
    const salones = getSalones(); 
    salones.forEach(salon => {
        const row = document.createElement('tr'); 
        row.innerHTML = `
            <td>${salon.id}</td>
            <td>${salon.nombre}</td>
            <td>${salon.capacidad}</td>
            <td>${salon.precio}</td>
            <td>${salon.fecha}</td>
            <td>
                <button class="btn btn-warning btn-sm" onclick="editSalon(${salon.id})">Editar</button>
                <button class="btn btn-danger btn-sm" onclick="deleteSalon(${salon.id})">Eliminar</button>
            </td>
        `;
        salonList.appendChild(row); 
    });
}

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const salon = {
            id: parseInt(document.getElementById('salon-id').value) || null, 
            nombre: document.getElementById('nombre').value,
            capacidad: document.getElementById('capacidad').value,
            precio: document.getElementById('precio').value,
            fecha: document.getElementById('fecha').value
        };

        if (!salon.nombre || !salon.capacidad || !salon.precio || !salon.fecha) {
            alert("Todos los campos son obligatorios.");
            return;
        }

        if (salon.id) {
            updateSalon(salon);
            alert("Salón actualizado con éxito.");
        } else {
            addSalon(salon);
            alert("Salón agregado con éxito.");
        }
        loadSalones();
        form.reset();
    });

    // Editar salón
  window.editSalon = function(id) {
    console.log("Editando salón con ID:", id); 
    const salones = getSalones();
    const salon = salones.find(s => s.id === id);
    console.log("Salon encontrado:", salon); 
    if (salon) {
        document.getElementById('salon-id').value = salon.id;
        document.getElementById('nombre').value = salon.nombre;
        document.getElementById('capacidad').value = salon.capacidad;
        document.getElementById('precio').value = salon.precio;
        document.getElementById('fecha').value = salon.fecha;
    }
};

// Eliminar salón
    window.deleteSalon = function(id) {
        deleteSalon(parseInt(id)); 
        loadSalones(); 
};

    loadSalones(); 
});
</script>
