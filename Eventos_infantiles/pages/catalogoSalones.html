<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Salones de Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/catalogoSalones.css">
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Salones de Eventos Disponibles</h1>
        
        <div class="row mb-4">
            <div class="col-md-6">
                <input type="text" id="filtroNombre" class="form-control" placeholder="Filtrar por nombre...">
            </div>
            <div class="col-md-3">
                <input type="number" id="filtroCapacidadMin" class="form-control" placeholder="Capacidad mínima">
            </div>
            <div class="col-md-3">
                <button id="btnFiltrar" class="btn btn-primary w-100">Filtrar</button>
            </div>
        </div>
        
       
        <div id="galeriaSalones" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
           
        </div>
    </div>

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="../js/salones.js"></script>
</body>
</html>
