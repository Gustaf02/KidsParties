<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salones Infantiles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/salonesReservaLocalStorage.css">
</head>
<body>



    <!-- Catálogo de Salones -->
     <!-- Header -->
     <header>
     <h1>HEADER</h1>
     </header>

    <main class="py-5">
        <div class="container">
            
            
            <!-- Loading Spinner -->
            <div id="loading" class="d-none">
                <div class="text-center">
                    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <p class="mt-3">Cargando salones...</p>
                </div>
            </div>
            
     
            <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
             
            <!-- Contenedor de las imagenes -->
            <div id="catalogo-container" class="row g-4"></div>
        </div>
    </main>


    <!-- Modal de Reserva -->
    <div class="modal fade" id="reservaModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalSalonTitle">Completar Reserva</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="reservaForm">
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombreCliente" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefonoCliente" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha del Evento</label>
                            <input type="date" class="form-control" id="fechaEvento" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cantidad de Personas</label>
                            <input type="number" class="form-control" id="cantidadPersonas" min="1" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnConfirmarReserva">Confirmar Reserva</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
     <footer>
            <h1>FOOTER</h1>
     </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/salonesReservaLocalStorage.js">
    </script>
</body>
</html>
