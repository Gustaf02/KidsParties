<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salones de Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <style>
        .cart {
            position: fixed;
            right: 20px;
            top: 20px;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
            width: 350px;
        }
        .card-img-top {
            height: 200px;
            object-fit: cover;
        }
        .service-card {
            transition: transform 0.3s ease;
        }
        .service-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Salones para Eventos</h1>
        
        <!-- Catálogo -->
        <div class="row g-4" id="catalogo-container">
            <!-- Los salones se cargarán aquí dinámicamente -->
        </div>

        <!-- Carrito -->
        <div class="cart">
            <h4 class="mb-3">🛒 Carrito de Reservas</h4>
            <div id="cart-alerts"></div>
            <ul id="cart-items" class="list-group mb-3">
                <!-- Items del carrito aparecerán aquí -->
            </ul>
            <div class="total-container bg-light p-3 rounded">
                <h5 class="d-flex justify-content-between">
                    <span>Total:</span>
                    <span>$<span id="total">0</span></span>
                </h5>
                <button class="btn btn-success w-100 mt-2" onclick="cart.checkout()">
                    Finalizar Reserva <i class="bi bi-check2-circle"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="cart-alerts" class="position-fixed top-0 end-0 p-3" style="z-index: 2000"></div>
    <!-- Plantilla para items del catálogo (usada en JS) -->
    <template id="card-template">
        <div class="col-md-4">
            <div class="card service-card h-100">
                <img class="card-img-top" src="" alt="Salón">
                <div class="card-body">
                    <h5 class="card-title"></h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="badge bg-primary"><i class="bi bi-people"></i> Capacidad: </span>
                        <span class="badge bg-success">$</span>
                    </div>
                    <p class="card-text"><i class="bi bi-calendar-check"></i> Disponible en: </p>
                    <button class="btn btn-primary w-100">
                        <i class="bi bi-cart-plus"></i> Reservar
                    </button>
                </div>
            </div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="carritoApi.js"></script>
</body>
</html>
