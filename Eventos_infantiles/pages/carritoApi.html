<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Salones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .card-img-top {
            height: 200px;
            object-fit: cover;
        }
        .card {
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .spinner-container {
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <h1 class="text-center mb-4">Catálogo de Salones</h1>
        
        <div id="loading" class="spinner-container">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
        </div>
        
        <div id="error-message" class="alert alert-danger d-none"></div>
        
        <div id="catalogo-container" class="row"></div>
    </div>

    <script>
        const API_KEY = '9tNEjFhwUIus25QDwOd8iywPhg5QEyYDWiVS9NlvWfD2MeSClgYAU125';
        
        async function fetchData() {
            try {
                // Mostrar spinner de carga
                document.getElementById('loading').classList.remove('d-none');
                document.getElementById('error-message').classList.add('d-none');
                
                // Hacer ambas llamadas a API simultáneamente
                const [imagesResponse, salonesResponse] = await Promise.all([
                    fetch('https://api.pexels.com/v1/search?query=birthday&per_page=28', {
                        headers: { 'Authorization': API_KEY }
                    }),
                    fetch('https://681a090f1ac1155635078a8f.mockapi.io/salones')
                ]);
                
                // Verificar respuestas
                if (!imagesResponse.ok) throw new Error('Error en API de imágenes');
                if (!salonesResponse.ok) throw new Error('Error en API de salones');
                
                // Convertir a JSON
                const [imagesData, salonesData] = await Promise.all([
                    imagesResponse.json(),
                    salonesResponse.json()
                ]);
                console.log(salonesData)
                console.log(imagesData)
                // Combinar datos
                const combinedData = salonesData.map((salon, index) => {
                    const imageIndex = index % imagesData.photos.length;
                    return {
                        ...salon,
                        imagen: imagesData.photos[imageIndex]?.src.medium || 'https://via.placeholder.com/300'
                    };
                });
                
                // Mostrar datos
                renderCatalog(combinedData);
                
            } catch (error) {
                console.error('Error:', error);
                showError('Error al cargar los datos: ' + error.message);
            } finally {
                document.getElementById('loading').classList.add('d-none');
            }
        }
        
        function renderCatalog(data) {
            const container = document.getElementById('catalogo-container');
            
            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <h4>No hay salones disponibles</h4>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = data.map(item => `
                <div class="col-md-4">
                    <div class="card h-100">
                        <img src="${item.imagen}" 
                             class="card-img-top" 
                             alt="${item.nombre}"
                             onerror="this.src='https://via.placeholder.com/300'">
                        <div class="card-body">
                            <h5 class="card-title">${item.nombre}</h5>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="badge bg-primary">Capacidad: ${item.capacidad || 'N/A'}</span>
                                <h5 class="text-success mb-0">$${(item.precio || 0).toLocaleString('es-AR')}</h5>
                            </div>
                            <p class="mt-2"><small class="text-muted">Disponible: ${item.fecha || 'Fecha no especificada'}</small></p>
                            <button class="btn btn-primary w-100">
                                <i class="bi bi-cart-plus"></i> Reservar
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.remove('d-none');
        }
        
        // Iniciar la carga de datos cuando la página esté lista
        document.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
